<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Sandhya's Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="auth.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="index.html">Sandhya<span>.</span></a>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to continue to the portfolio.</p>

    <button id="google-btn" class="google-btn" type="button">
      <span aria-hidden="true">G</span> Continue with Google
    </button>

    <div class="separator"><span>or use email</span></div>

    <form id="signin-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Your password">

      <button class="primary-btn" type="submit">Sign in</button>
    </form>

    <p class="switch-text">New here? <button id="show-signup" class="text-btn" type="button">Create an account</button></p>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <p class="small-note">Use your own account. Never share your password or API secrets.</p>
  </main>
</body>
</html>
